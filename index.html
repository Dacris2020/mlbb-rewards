<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLBB Diamond Rewards</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary: #f39c12;
      --bg: #12141d;
      --card-bg: #1e2230;
      --text: #ffffff;
      --accent: #27ae60;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 100%;
      background: linear-gradient(135deg, #2b1055, #7597de);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-sizing: border-box;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .header h1 { margin: 0; font-size: 20px; color: #fff; }
    .balance-card {
      background-color: var(--card-bg);
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }
    .balance { font-size: 22px; font-weight: bold; color: var(--primary); }
    .btn-action {
      background-color: var(--primary);
      color: #000;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    .btn-redeem { background-color: var(--accent); color: #fff; }
    .section { width: 100%; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>💎 MLBB Diamonds App</h1>
    <p style="font-size: 12px; margin-top: 5px;">¡Gana puntos y canjea diamantes reales!</p>
  </div>

  <div class="balance-card">
    <span>Tus Puntos:</span>
    <span class="balance" id="pointsDisplay">0 Pts</span>
  </div>

  <div class="section">
    <h3>🚀 Tareas Disponibles</h3>
    <button class="btn-action" onclick="watchAd()">📺 Ver Anuncio (+10 Pts)</button>
    <button class="btn-action" style="background:#3498db; color:#fff;" onclick="dailyReward()">🎁 Recompensa Diaria (+5 Pts)</button>
  </div>

  <div class="section">
    <h3>🛒 Canjear Diamantes</h3>
    <button class="btn-action btn-redeem" onclick="redeem(1000, 50)">💎 50 Diamantes (1,000 Pts)</button>
    <button class="btn-action btn-redeem" style="margin-top: 8px;" onclick="redeem(4500, 250)">💎 250 Diamantes (4,500 Pts)</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // --- CONFIGURACIÓN PRINCIPAL ---
    // Reemplaza los dos valores de abajo con tu SmartLink de Monetag y el Token que te dio BotFather
    const MONETAG_SMARTLINK = "PEGA_AQUI_TU_SMARTLINK_MONETAG"; 
    const BOT_TOKEN = "PEGA_AQUI_TU_BOT_TOKEN_DE_BOTFATHER";
    const ADMIN_CHAT_ID = "6129588092"; 

    let points = parseInt(localStorage.getItem('userPoints')) || 0;
    updateDisplay();

    function updateDisplay() {
      document.getElementById('pointsDisplay').innerText = points + " Pts";
      localStorage.setItem('userPoints', points);
    }

    function watchAd() {
      if (MONETAG_SMARTLINK.includes("PEGA_AQUI")) {
        alert("¡Recuerda pegar tu SmartLink de Monetag en el código!");
      } else {
        tg.openLink(MONETAG_SMARTLINK);
      }
      points += 10;
      updateDisplay();
      alert("¡Has recibido +10 Pts!");
    }

    function dailyReward() {
      const lastClaim = localStorage.getItem('lastClaimDate');
      const today = new Date().toDateString();

      if (lastClaim === today) {
        alert("Ya reclamaste tu recompensa de hoy. ¡Vuelve mañana!");
      } else {
        points += 5;
        localStorage.setItem('lastClaimDate', today);
        updateDisplay();
        alert("¡Recompensa diaria reclamada (+5 Pts)!");
      }
    }

    function redeem(cost, diamonds) {
      if (points >= cost) {
        const mlbbID = prompt("Ingresa tu ID de MLBB y Zone ID (Ej: 12345678 1234):");
        if (mlbbID) {
          const user = tg.initDataUnsafe.user || {};
          const username = user.username ? "@" + user.username : user.first_name || "Desconocido";

          const text = `🚨 *NUEVO CANJE SOLICITADO*\n\n👤 **Usuario:** ${username}\n💎 **Premio:** ${diamonds} Diamantes\n🎮 **ID MLBB:** \`${mlbbID}\``;
          
          fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              chat_id: ADMIN_CHAT_ID,
              text: text,
              parse_mode: "Markdown"
            })
          });

          points -= cost;
          updateDisplay();
          alert(`¡Solicitud enviada con éxito! Revisa tu cuenta pronto.`);
        }
      } else {
        alert(`Necesitas ${cost} Pts para canjear este paquete.`);
      }
    }
  </script>
</body>
</html>
